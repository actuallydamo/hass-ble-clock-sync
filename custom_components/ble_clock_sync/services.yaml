sync_clocks_time:
  target:
    device:
      integration: ble_clock_sync
  fields:
    timestamp:
      example: 1702200346
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
    timezone:
      example: -5.5
      selector:
        number:
          min: -12
          max: 14
          step: 0.25
          mode: box
sync_all_clocks_time:
  fields:
    timestamp:
      example: 1702200346
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
    timezone:
      example: -5.5
      selector:
        number:
          min: -12
          max: 14
          step: 0.25
          mode: box
